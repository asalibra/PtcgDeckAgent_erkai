server {
    listen 8080;
    server_name _;

    # Web client static files
    root /app/exports/web;
    index index.html;

    # Correct MIME type for wasm
    types {
        application/wasm wasm;
        application/octet-stream pck;
        application/javascript js;
        text/html html;
        text/css css;
        image/png png;
        application/json json;
    }

    # SharedArrayBuffer headers (required by Godot 4.x web export)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Gzip compression
    gzip on;
    gzip_types application/wasm application/javascript text/html text/css application/json;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(wasm|pck|png|js|css)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket proxy to game server (for stability + keepalive)
    location /ws {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

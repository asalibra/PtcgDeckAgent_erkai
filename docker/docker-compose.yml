services:
  ptcg-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ptcg-server
    restart: unless-stopped
    ports:
      - "1234:8080"    # Web client (nginx) - public port
      - "9000:9000"    # WebSocket direct access (optional)
    environment:
      - SERVER_PORT=9000
      - WEB_PORT=8080
    volumes:
      # Persist server data (decks, replays, etc.)
      - ptcg-data:/app/user
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ptcg-data:
